<!DOCTYPE html>
<html lang="en" data-look="new">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- iPad port Phase 1 (Ipad.md §2.8): home-screen web-app shell. The WebClip /
       Add-to-Home-Screen container reads these to run fullscreen without
       browser chrome; viewport-fit=cover unlocks env(safe-area-inset-*). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Space Cowboy">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>Space Cowboy — VLEO Debris Remediation</title>

  <style>
    /* === TYPE (Session L, plan D-J aviation display grammar) ===
       B612 — the Airbus/Intactile cockpit-display family (SIL OFL 1.1, ./fonts/,
       licence in ./fonts/OFL.txt). Self-hosted TTFs: no CDN, precached by sw.js
       (fonts/ is cache-first, immutable like vendor/). font-display: swap keeps
       first paint on the local fallback; B612 Mono's advance is 0.65em vs
       Courier New's 0.60em (+8 % per glyph), so fixed widths are read against
       the wider face. The two tokens below are the ONLY place a family is
       named; every other rule says var(--font-mono) / var(--font-ui). */
    @font-face {
      font-family: 'B612';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/B612-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'B612';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('fonts/B612-Bold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'B612 Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/B612Mono-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'B612 Mono';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('fonts/B612Mono-Bold.ttf') format('truetype');
    }
    /* h2-hud-look D3: D-DIN (Datto Inc., SIL OFL 1.1, ./fonts/D-DIN-OFL.txt) — the DIN-style label face.
       Used only by the new look (--font-label below); the faces download lazily, so the classic
       look never fetches them. Numbers stay B612 Mono in both looks. */
    @font-face {
      font-family: 'D-DIN';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/D-DIN-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'D-DIN';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('fonts/D-DIN-Bold.ttf') format('truetype');
    }
    :root {
      --font-ui: 'B612', 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'B612 Mono', 'Courier New', monospace;
      /* HUD side width (h1b-mother-width, owner 2026-10-15): the MOTHER pane, the left column and the
         comms pane are all this wide. 480 = Constants.COMMS.PANE_WIDTH_PX = RailGeometry MOTHER_PANE_WIDTH_PX
         (CSS cannot import; a test pins the three). 344 = the 280 score strip + 2 x 16 screen edges + 2 x 16
         gaps, so the two panes narrow together and never reach the centred strip. Floor 300. Layout, so it
         lives here and applies to both looks. */
      --hud-side-w: clamp(300px, calc((100vw - 344px) / 2), 480px);
    }

    /* === HUD LOOK (h2-hud-look, owner 2026-10-14: default on, a menu switch back to today's style) ===
       The variables are defined ONLY here, under html[data-look="new"]. Every converted HUD
       colour reads var(--hud-<role>, <today's literal>), so when js/ui/HudLook.js removes the
       attribute (classic) every var() falls back to the literal it was written with: classic is
       today's look by construction. Nothing below is defined at :root. `<html>` ships with the
       attribute (no first-paint flash). Roles follow FAA AC 25-11B: green normal, amber caution,
       red warning, cyan selected/info, magenta target, white data. */
    html[data-look="new"] {
      --hud-plate: rgba(11, 16, 22, 0.92);
      --hud-hairline: #2A3441;
      --hud-text: #E6EDF3;
      --hud-label: #9FB0C0;
      --hud-dim: #6B7C8C;
      --hud-normal: #3DDC97;
      --hud-caution: #FFB020;
      --hud-warning: #FF5C57;
      --hud-info: #4DD0FF;
      --hud-target: #E86BFF;
      --hud-mpd: #B48CFF;
      --hud-ink: #0B1016;
      /* channel triples, for translucent tints: rgb(var(--hud-normal-rgb, 0 255 136) / 0.3) */
      --hud-text-rgb: 230 237 243;
      --hud-label-rgb: 159 176 192;
      --hud-dim-rgb: 107 124 140;
      --hud-normal-rgb: 61 220 151;
      --hud-caution-rgb: 255 176 32;
      --hud-warning-rgb: 255 92 87;
      --hud-info-rgb: 77 208 255;
      --hud-target-rgb: 232 107 255;
      --hud-mpd-rgb: 180 140 255;
      --hud-ink-rgb: 11 16 22;
      /* a dark halo, no glow */
      --hud-title-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
      --font-label: 'D-DIN', 'B612', 'Helvetica Neue', Arial, sans-serif;
    }
    /* Labels and pane titles: D-DIN, capitals, +0.06em. Sizes and weights are left as they are.
       !important because several of these classes set their own spacing behind an id selector. */
    html[data-look="new"] :is(.pane-title, .vp-title, .vp-label, .power-label, .md-label, .orbit-label,
        .next-title, .next-label, .cargo-title, .fma-label, .ovr-main-title, .mpd-burst-label, .hud-pin-label,
        .go-heading) {
      font-family: var(--font-label) !important;
      text-transform: uppercase !important;
      letter-spacing: 0.06em !important;
    }
    /* Game-over / victory screen (y1-gameover-look): inherited stat text takes the label colour, bare values the data white.
       An inline <b style="color:…"> still wins. New look only; classic keeps body green. */
    html[data-look="new"] #gameover-stats { color: var(--hud-label); }
    html[data-look="new"] #gameover-stats b { color: var(--hud-text); }

    /* === RESET & BASE === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: var(--font-mono);
      color: #00ff88;
    }

    /* === CANVAS === */
    #game-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      /* iPad port (Ipad.md §3): the canvas owns its touches — no scroll,
         no pinch-page-zoom, no long-press callout, no text selection. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Build stamp (Ipad.md §2.5 update-honesty law): the corner hash is the
       ONLY proof a cable update landed. Filled from ./data/build-tag.json. */
    #build-stamp {
      position: fixed;
      left: calc(6px + env(safe-area-inset-left, 0px));
      bottom: calc(4px + env(safe-area-inset-bottom, 0px));
      z-index: 11;
      font: 10px var(--font-mono);
      color: rgba(0, 255, 136, 0.35);
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Build stamp floor law (Session O plan D9, owner 2026-09-07; amended
       §13 ruling 2, 2026-09-24 — menu only): the hub writes
       body[data-ladder-floor] (the data-pure-scenery attribute pattern; menu /
       ?ladder=0 carry NO attribute → the stamp shows = delivery loop intact).
       EVERY engaged floor hides it — F1 included (the rail is the index; the
       update check is unchanged: relaunch → the menu → the corner hash). The
       pure-scenery rule below still hides it transiently. */
    body[data-ladder-floor] #build-stamp { display: none; }

    /* PURE SCENERY (Session N.5 D7, owner 2026-09-07): once the `-` walk has
       cleared every pane rung and bowed the rails out, the hub sets ONE body
       attribute (LadderController.setRailsShy -> pureScenery hook) and the
       bottom chrome goes too: the SPECS tab (Session U: the ONE workbench pane's
       tab, #ladder-workbench-tab — the REFIT / LIBRARY tab pair retired with
       the two-drawer layout) and the build stamp
       (Ipad.md update-honesty exception: transient only). The vitals line and the glass STORE chip left the rule —
       and the cockpit — in Session O, D8/D10 (with the ladder on you pinch to
       F1 and tap SPECS; `?ladder=0` keeps the STORE chip). !important beats
       inline writes (the data-density-hidden
       discipline); `+`, any ride or a fresh engage clears the attribute. */
    body[data-pure-scenery] #ladder-workbench-tab,
    body[data-pure-scenery] #build-stamp { display: none !important; }

    /* === HUD OVERLAY === */
    #hud-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

     .hud-panel {
      position: absolute;
      width: 280px; /* = HUD_COLUMN_WIDTH_PX (js/ui/RailGeometry.js) — CSS cannot import */
      background: var(--hud-plate, rgba(5, 10, 20, 0.95));
      border: 1px solid var(--hud-hairline, rgba(0, 255, 136, 0.3));
      border-radius: 4px;
      padding: 6px 8px;
      pointer-events: none;
      /* backdrop-filter REMOVED — was causing ~40 % GPU on M4 Max even when
         WebGL render was skipped. Chrome re-runs the blur shader every
         composite frame for every visible element with backdrop-filter
         (even when the backdrop pixels haven't changed). With ~10
         `.hud-panel` elements on a 5K × 120 Hz display this dominated the
         compositor cost. The opaque 0.95-alpha background is sufficient
         contrast; the blur was cosmetic, not informational. */
      font-size: 13px;
      color: var(--hud-normal, #00ff88);
      font-family: var(--font-mono);
    }

    /* ST-2.2: High-opacity fallback when panels overlap bright Earth */
    .hud-panel--earth-overlap {
      background: rgb(var(--hud-ink-rgb, 5 10 20) / 0.98) !important;
    }

    /* Hover-to-expand for left-column panels */
    .hud-panel-expandable {
      pointer-events: auto;  /* Enable hover detection */
      cursor: default;
    }

    .hud-panel-expandable .panel-expand-section {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.2s ease,
                  margin 0.2s ease, border-color 0.2s ease;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: 0;
      border-top: 1px solid transparent;
    }

    .hud-panel-expandable:hover .panel-expand-section,
    .hud-panel-expandable.force-expand .panel-expand-section {
      max-height: 200px;  /* Generous max — actual height determined by content */
      opacity: 1;
      padding-top: 4px;
      padding-bottom: 2px;
      margin-top: 4px;
      border-top-color: var(--hud-hairline, rgba(0,255,136,0.15));
    }

    /* Arm hover details — revealed when fleet panel hovered */
    .hud-panel-expandable:hover .arm-hover-detail,
    .hud-panel-expandable.force-expand .arm-hover-detail {
      display: block !important;  /* Override inline display:none */
    }

    /* Energy hint — more visible on hover */
    .hud-panel-expandable:hover .energy-hint {
      opacity: 0.7 !important;
    }

    /* F11: Horizontal-expand left panels (PROPULSION + ENERGY) */
    .hud-panel-h-expand {
      width: 110px;
      overflow: hidden;
      transition: width 0.3s ease;
      position: relative;
    }
    .hud-panel-h-expand:hover {
      width: 260px;
    }
    .hud-panel-h-expand .panel-full-content {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.2s ease 0.1s;
    }
    .hud-panel-h-expand:hover .panel-full-content {
      max-height: 600px;
      opacity: 1;
    }
    .hud-panel-h-expand .panel-collapsed-summary {
      opacity: 1;
      transition: opacity 0.15s ease, max-height 0.2s ease;
      overflow: hidden;
      padding: 2px 0;
    }
    .hud-panel-h-expand:hover .panel-collapsed-summary {
      opacity: 0;
      max-height: 0 !important;
      overflow: hidden;
      pointer-events: none;
    }

    /* === LEFT-COLUMN FLEX LAYOUT (always-expanded panels) === */
     #hud-left-column {
      display: flex;           /* safety net: JS sets this inline, but preserve it if cleared */
      flex-direction: column;
      left: max(0px, env(safe-area-inset-left)); /* = PANE_CORNER_PX (js/ui/RailGeometry.js): MOTHER sits IN the top-left corner (owner 2026-10-18) */
      width: var(--hud-side-w, 480px); /* = LEFT_COLUMN_WIDTH_PX (js/ui/RailGeometry.js) — the widest child, Mother (the merged pane, as wide as comms); children hug the left edge (align-items: flex-start inline) */
      scrollbar-width: thin;
      scrollbar-color: rgb(var(--hud-normal-rgb, 0 255 136) / 0.2) transparent;
    }

    /* Panels inside left column: flex children, not absolute. Each pane carries
       its own inline width (Mother 480 / Daughters 350 = MOTHER_PANE_WIDTH_PX /
       ARMS_PANE_WIDTH_PX); the LeftStack riders below the column are overlay
       children on the .hud-panel 280 base. */
    #hud-left-column > .hud-panel {
      position: relative !important;
    }

    /* Always show full content */
    #hud-left-column .panel-full-content {
      max-height: none !important;
      opacity: 1 !important;
    }

    /* === PaneChrome 2-step: minimize left-column panels to their summary === */
    /* When a left-column panel is on its 'min' step, flip the always-expanded
       default above: hide the full content. */
    #hud-left-column .hud-panel.pane-step-min .panel-full-content {
      max-height: 0 !important;
      opacity: 0 !important;
      overflow: hidden !important;
      pointer-events: none !important;
    }

    /* MOTHER pane: the inner Propulsion / Energy .panel-full-content blocks are
       always "open" — their show/hide is driven by the .mother-detail wrapper
       (hover-expand / pinned), not by the pane-step-min flip above. Override so
       the min step (compact digest) doesn't double-collapse the inner content.
       NOTE: must out-specify the suppressor above
       (`#hud-left-column .hud-panel.pane-step-min .panel-full-content`, 1 id +
       3 classes). Scoping under #hud-left-column gives 2 ids + 2 classes so this
       wins the !important tie — otherwise the hover-reveal shows an empty box. */
    #hud-left-column #hud-mother-panel.pane-step-min .panel-full-content {
      max-height: none !important;
      opacity: 1 !important;
      overflow: visible !important;
      pointer-events: auto !important;
    }

    /* Left-column panels: auto pointer-events for hover detection */
    #hud-mother-panel,
    #hud-power-panel,
    #hud-arms-panel {
      pointer-events: auto;
    }
    /* Glass (pointer: coarse): 44 px hit boxes — Daughters rows + DEPLOY/REEL/RECALL,
       Target rows. Desktop heights stay as authored. Plan Task 13 / locked #13. */
    @media (pointer: coarse) {
      #hud-arms-panel .fleet-row,
      #hud-arms-status .fleet-row { min-height: 44px; box-sizing: border-box; }
      #hud-arms-status .fleet-btn { min-height: 44px; min-width: 44px; box-sizing: border-box; }
      #hud-targets-panel .target-row { min-height: 44px; box-sizing: border-box; }
    }

    /* === MOTHER pane: digest-led, hover-expand detail ===
       The MOTHER pane leads with a one-line readiness digest and hides the full
       Propulsion + Energy detail by default. Hovering the pane reveals it
       (StatusPanel also toggles .mother-expanded on hover). */
    #hud-mother-panel .mother-detail {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.2s ease 0.05s;
    }
    #hud-mother-panel:hover .mother-detail,
    #hud-vitals:hover #hud-mother-panel .mother-detail,
    #hud-mother-panel.mother-expanded .mother-detail {
      max-height: 720px;
      opacity: 1;
    }
    /* h1-mother-pane D4: the MOTHER section is a child of the merged #hud-vitals box, so a hover
       anywhere on the box opens the detail (the root's own :hover, not just the section's). */
    #hud-vitals:hover #hud-mother-panel .panel-expand-section {
      max-height: 200px;
      opacity: 1;
      padding-top: 4px;
      padding-bottom: 2px;
      margin-top: 4px;
      border-top-color: var(--hud-hairline, rgba(0,255,136,0.15));
    }
    #hud-vitals:hover #hud-mother-panel .energy-hint { opacity: 0.7 !important; }
    /* h1-mother-pane D1: ONE box. The MOTHER section carries no border / plate / title of its
       own (the .hud-panel base would draw a second box inside the first). */
    #hud-vitals > #hud-mother-panel {
      position: relative !important;
      width: auto;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      background: none;
    }
    /* D4: while the MOTHER section is visible (F2, or any floor the MORE ladder pulls it onto) the
       merged box takes pointer events; with the section hidden it stays display-only. */
    #hud-vitals:has(> #hud-mother-panel:not([data-density-hidden]):not([data-floor-gone]):not([style*="display: none"])) {
      pointer-events: auto;
    }
    /* q3-mother-pane D2/D3: the net line (#mother-digest, built by StatusPanel, moved by attachToVitals) rides MOTHER's
       title row, left of the memo chip. It stays the `mother` rung's: wherever the section is hidden (F1, F3, F4, the
       MORE ladder, display none) the line is hidden with it. The now-empty section would still cost one flex gap, so a
       -3 px margin cancels it: the collapsed pane is VITALS_COLLAPSED_HEIGHT_PX (91), the height comms matches. */
    #hud-vitals > #hud-mother-panel { margin-top: -3px; }
    #hud-vitals .vp-title > #mother-digest {
      margin-left: auto;
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
    }
    #hud-vitals .vp-title > #mother-digest + .vp-title-slot { margin-left: 0; }
    #hud-vitals:not(:has(> #hud-mother-panel:not([data-density-hidden]):not([data-floor-gone]):not([style*="display: none"]))) .vp-title > #mother-digest {
      display: none !important;
    }
    /* Narrow panes (--hud-side-w clamps from 480 down to 300 below a 1304 px screen): the full line plus the longest
       memo chip (`AP PROGRADE · HOLD`) needs about 430 px of pane, i.e. a 1204 px screen. Below 1220 px the two
       reaches drop out and the line reads `NET ━ 50/50 │ LARGE 4/4`; the reaches stay in the tooltips. */
    @media (max-width: 1220px) {
      #hud-vitals #mother-digest .md-reach-group { display: none !important; }
    }
    /* Below ~1060 px the pane is under ~350 px: the mini-bar goes too (the number says the same), so the line still
       clears MOTHER and a typical memo chip at the 300 px floor. */
    @media (max-width: 1060px) {
      #hud-vitals #mother-digest .md-track { display: none !important; }
      #hud-vitals .vp-title { gap: 4px; }
      #hud-vitals #mother-digest { gap: 3px; }
      #hud-vitals #mother-digest .md-core { gap: 3px; }
    }

    /* q3 round 2 (R2): the net line never clips. StatusPanel._fitDigest sets data-fit on #mother-digest when the title
       row is too narrow, dropping parts in this order: reaches, gauge, Large Net tail (countdown), /max suffixes. */
    #hud-vitals #mother-digest[data-fit~="reach"] .md-reach-group { display: none !important; }
    #hud-vitals #mother-digest[data-fit~="track"] .md-track { display: none !important; }

    /* Nested Propulsion / Energy blocks must NOT render their own boxed
       border/background — only the MOTHER container is a visible box. */
    #hud-mother-panel .mother-block {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      position: relative;
    }

    /* The MOTHER pane is hover-reveal, so its PaneChrome resize badge (the small
       +/− glyph) is redundant clutter — hide it. */
    #hud-mother-panel .hud-pane-badge {
      display: none !important;
    }

    .hud-panel[style*="pointer-events: auto"],
    .hud-panel.interactive {
      pointer-events: auto;
    }

    /* === RESOURCE BARS === */
    .hud-resource-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0;
      font-size: 11px;
    }

    .hud-resource-row > span:first-child {
      width: 42px;
      flex-shrink: 0;
    }

    .hud-bar-track {
      flex: 1;
      height: 8px;
      background: rgb(var(--hud-normal-rgb, 0 255 136) / 0.1);
      border-radius: 2px;
      overflow: hidden;
      min-width: 80px;
    }

    .hud-bar-fill {
      height: 100%;
      background: var(--hud-normal, #00ff88);
      border-radius: 2px;
      transition: width 0.3s ease, background-color 0.5s ease;
    }

    /* === Left-column pane readability (Propulsion / Energy / Daughters) ===
       These three panes carry the densest small-font telemetry. They ride the
       same --font-mono token as every pane (B612 Mono is a cockpit face, drawn
       for legibility at small sizes — the pre-Session-L ui-monospace/SF Mono
       stack existed only because Courier New rendered muddy below ~12px), and
       keep grayscale antialiasing, tighter line metrics, and higher-contrast
       titles. */
    #hud-mother-panel,
    #hud-power-panel,
    #hud-arms-panel {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: 0.015em;
      text-rendering: optimizeLegibility;
    }

    /* Pane titles — bump size/weight/contrast so the section is scannable */
    #hud-mother-panel .pane-title,
    #hud-power-panel .pane-title,
    #hud-arms-panel .pane-title,
    #hud-targets-panel .pane-title {
      font-size: 12px !important;
      font-weight: 700;
      letter-spacing: 0.14em;
      opacity: 0.95 !important;
      text-shadow: var(--hud-title-shadow, 0 0 8px rgba(0, 255, 136, 0.35));
    }

    /* Resource / power / fleet rows — larger, bolder labels and readouts */
    #hud-mother-panel .hud-resource-row { font-size: 12px; }
    #hud-power-panel .power-label,
    #hud-power-panel .power-value {
      font-size: 11px !important;
      font-weight: 600;
    }
    #hud-arms-panel #hud-arms-status {
      font-size: 11px !important;
      line-height: 1.6 !important;
    }

    /* === GLOW TEXT === */
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 10px rgba(0,255,136,0.5); }
      50% { text-shadow: 0 0 20px rgba(0,255,136,0.8), 0 0 40px rgba(0,255,136,0.3); }
    }

    .glow-text {
      animation: glowPulse 2s ease-in-out infinite;
    }

    /* === SCREEN OVERLAYS === */
    #menu-screen, #briefing-screen, #shop-screen, #gameover-screen {
      font-family: var(--font-mono);
    }

    /* === SCROLLBAR STYLING === */
    .hud-panel::-webkit-scrollbar,
    #shop-screen ::-webkit-scrollbar,
    #briefing-screen ::-webkit-scrollbar {
      width: 4px;
    }

    .hud-panel::-webkit-scrollbar-track,
    #shop-screen ::-webkit-scrollbar-track,
    #briefing-screen ::-webkit-scrollbar-track {
      background: rgba(0,255,136,0.05);
    }

    .hud-panel::-webkit-scrollbar-thumb,
    #shop-screen ::-webkit-scrollbar-thumb,
    #briefing-screen ::-webkit-scrollbar-thumb {
      background: rgba(0,255,136,0.2);
      border-radius: 2px;
    }

    /* === BUTTON FOCUS === */
    button:focus {
      outline: 1px solid rgba(0,255,136,0.5);
      outline-offset: 2px;
    }

    /* === RETICLE CANVAS === */
    #reticle-canvas,
    #navsphere-canvas {
      image-rendering: crisp-edges;
    }

    /* === RESPONSIVE HUD === */
    @media (max-width: 768px) {
      .hud-panel { font-size: 11px; padding: 6px 8px; }
      #hud-targets-panel { display: none !important; }
      #hud-controls-panel { display: none !important; }
    }
    /* Comms stays on screen on floor 2 down to 744 px wide (owner 2026-10-13:
     * "comms should be visible on f2 at start of game"). MOTHER and comms are the same
     * width (--hud-side-w, defined at :root: 480 px, narrowing together so the centred
     * 280 px score strip, x centre +-140, y 8-36, stays clear of both; the floor is 300).
     * Below 920 px comms also drops 34 px so it sits under the strip (y 8-36). */
    @media (max-width: 920px) {
      #hud-comms-panel { top: 44px !important; }
    }

    /* MOTHER (top-left) and COMMS (top-right) sit IN their screen corners (PANE_CORNER_PX 0, js/ui/RailGeometry.js;
     * owner 2026-10-18): no border and no corner radius on the sides that touch the screen. Inner padding is
     * unchanged, so the text stays 7-8 px from the edge. Below 920 px COMMS sits 44 px down (under the score strip),
     * so only its right side touches the screen there; the top border returns. */
    #hud-left-column > #hud-vitals {
      /* The dropped top border (-1 px) is given back as top padding (PAD_Y_PX 5 + 1), so MOTHER stays
       * VITALS_COLLAPSED_HEIGHT_PX (91) tall = COMMS's 'line' step, and the text keeps its place. */
      padding-top: 6px;
      border-left-width: 0;
      border-top-width: 0;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-top-right-radius: 0;
    }
    #hud-comms-panel {
      border-right-width: 0;
      border-top-width: 0;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-top-left-radius: 0;
    }
    @media (max-width: 920px) {
      #hud-comms-panel { border-top-width: 1px; border-top-left-radius: 4px; border-top-right-radius: 0; }
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 1s ease-out;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen h1 {
      font-family: var(--font-mono);
      color: #00ff88;
      font-size: 2.5rem;
      letter-spacing: 0.3em;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }

    #loading-screen p {
      font-family: var(--font-mono);
      color: rgba(0, 255, 136, 0.6);
      font-size: 0.9rem;
    }
  </style>

  <!-- §13: importmap MUST be parsed before any module preload/load that uses
       bare specifiers like `import * as THREE from 'three'`. Previously the
       modulepreload of ./js/main.js was placed BEFORE the importmap, which
       caused an intermittent browser race: main.js was fetched + its imports
       resolved before the importmap registered, throwing
       "Failed to resolve module specifier 'three'". Moved importmap above
       all modulepreload tags to permanently eliminate the race. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>

  <!-- PR P0.2 — Resource hints: preload critical modules so the browser
       can fetch them in parallel with parsing the import map. (The small Earth
       day picture was preloaded here until 2026-10-18; no tier asks for it
       first, so the preload only cost bytes.) Three.js is vendored same-origin under ./vendor/ (relative
       paths resolve to '/' locally and '/SCB/' on GitHub Pages) so the sim is
       fully offline-first — no CDN, no internet dependency at runtime. -->
  <link rel="modulepreload" href="./js/main.js">
  <link rel="modulepreload" href="./vendor/three/build/three.module.js">
  <!-- Session L (D-J): the body face, fetched in parallel with the parse so the
       font-display:swap flip lands before the loading screen settles. `crossorigin`
       is mandatory on font preloads (CSS fetches fonts in CORS mode; without it
       the browser fetches twice). B612-Regular (--font-ui) gained its first
       consumer with the menu lore prose (MenuScreen.js .adr-prose + #menu-tip,
       Sept 2026), so it is preloaded too: ~150 KB, cache-first offline via the
       precache, and no FOUT on the first menu paint. -->
  <link rel="preload" as="font" type="font/ttf" href="./fonts/B612Mono-Regular.ttf" crossorigin>
  <link rel="preload" as="font" type="font/ttf" href="./fonts/B612-Regular.ttf" crossorigin>
</head>
<body>
  <!-- F7: JavaScript is required — this is the only content non-JS visitors see. -->
  <noscript>
    <div style="position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;
                align-items:center;justify-content:center;background:#000;color:#00ff88;
                font-family:var(--font-mono);text-align:center;padding:24px;">
      <div style="font-size:2rem;letter-spacing:0.25em;margin-bottom:14px;">SPACE COWBOY</div>
      <div style="max-width:520px;color:rgba(0,255,136,0.7);line-height:1.6;">
        This simulation needs JavaScript and a WebGL2-capable browser.
        Please enable JavaScript and reload.
      </div>
    </div>
  </noscript>

  <!-- Loading screen -->
  <div id="loading-screen">
    <h1>SPACE COWBOY</h1>
    <p>Initializing VLEO systems…</p>
  </div>

  <!-- Three.js canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- HUD overlay (pointer-events: none — clicks pass through to canvas) -->
  <div id="hud-overlay"></div>

  <!-- Build stamp (Ipad.md §2.5): a visible content hash is the only honest
       update witness on a sealed device — "I relaunched it" proves nothing.
       ./data/build-tag.json is served local-first by sw.js (from the running
       build's own app cache), so it is always the copy of the build actually
       running; a newer build waits until the next start or a tap on the card. -->
  <div id="build-stamp"></div>
  <script>
    // Session J.5 review fix: ONE boot read of the tag. The corner stamp and
    // the update watcher (js/core/UpdateWatch.js) share this promise, so a
    // deploy landing between two separate fetches can no longer split their
    // baselines (corner = A while the watcher booted on B).
    window.__bootBuildTag = fetch('./data/build-tag.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; /* no tag file (dev) — stamp stays empty */ });
    window.__bootBuildTag.then(function (t) {
      var el = document.getElementById('build-stamp');
      if (el && t && t.tag) el.textContent = t.tag;
    });
  </script>

  <!-- Game bootstrap -->
  <!-- F7 boot resilience — this classic script runs BEFORE the deferred ES
       module below, so it can (a) verify WebGL2 up front with a friendly
       message, and (b) catch any uncaught boot error / promise rejection and
       show a retro failure card with a Reload button instead of the old silent
       black screen. The loading screen is dismissed ONLY by main.js on success
       (it sets window.__bootOk), so we no longer hide it on window.load — that
       used to mask a failed boot as a black screen. -->
  <script>
    (function () {
      var shown = false;
      function esc(s) {
        return String(s == null ? '' : s).replace(/[<>&]/g, function (c) {
          return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
        });
      }
      function showBootFailure(title, detailHtml) {
        // Never show over a successfully-booted game (post-boot runtime errors
        // are not boot failures), and only show once.
        if (shown || window.__bootOk) return;
        shown = true;
        var card = document.createElement('div');
        card.id = 'boot-failure';
        card.setAttribute('role', 'alert');
        card.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;' +
          'flex-direction:column;align-items:center;justify-content:center;background:#000;' +
          'color:#00ff88;font-family:var(--font-mono);text-align:center;padding:24px;';
        card.innerHTML =
          '<div style="font-size:2rem;letter-spacing:0.25em;text-shadow:0 0 18px rgba(0,255,136,0.5);margin-bottom:14px;">' +
            esc(title || 'SYSTEMS OFFLINE') + '</div>' +
          '<div style="max-width:560px;color:rgba(0,255,136,0.7);font-size:0.95rem;line-height:1.6;margin-bottom:22px;">' +
            (detailHtml || 'The simulation failed to start.') + '</div>' +
          '<button id="boot-reload" type="button" style="font-family:inherit;color:#00ff88;' +
            'background:rgba(0,255,136,0.1);border:2px solid rgba(0,255,136,0.5);padding:10px 32px;' +
            'border-radius:4px;letter-spacing:0.15em;cursor:pointer;">RELOAD ↻</button>';
        (document.body || document.documentElement).appendChild(card);
        var btn = document.getElementById('boot-reload');
        if (btn) btn.addEventListener('click', function () { window.location.reload(); });
      }
      window.__showBootFailure = showBootFailure;

      // (a) WebGL2 capability check — the friendliest possible message.
      try {
        if (!document.createElement('canvas').getContext('webgl2')) {
          showBootFailure('WEBGL2 REQUIRED',
            'Space Cowboy needs a WebGL2-capable browser with hardware acceleration ' +
            'enabled. Try a recent Chrome, Edge, Firefox or Safari and make sure ' +
            'hardware acceleration is turned on.');
        }
      } catch (e) { /* getContext can throw when locked down — the error path covers it */ }

      // (b) Uncaught boot error / rejection → failure card (scoped to boot via __bootOk).
      window.addEventListener('error', function (e) {
        showBootFailure('SYSTEMS OFFLINE',
          'The simulation hit an error while starting.<br><br><code style="color:rgba(0,255,136,0.55);' +
          'font-size:0.8rem;">' + esc(e && (e.message || (e.error && e.error.message))) + '</code>');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        showBootFailure('SYSTEMS OFFLINE',
          'The simulation failed to initialize.<br><br><code style="color:rgba(0,255,136,0.55);' +
          'font-size:0.8rem;">' + esc(r && (r.message || r)) + '</code>');
      });
    })();
  </script>
  <script type="module">
    // main.js hides #loading-screen and sets window.__bootOk on success.
    import './js/main.js';
  </script>

  <!-- PR P0.3 — Service Worker registration. Relative path resolves to
       the page's directory: '/' locally, '/SCB/' on GitHub Pages.
       Dev-safety: on localhost the SW is NOT registered and any previously
       installed SW + its caches are torn down, so local edits always load
       fresh (the SW's cache-first/precache otherwise serves stale modules
       across reloads and masks code changes). Production (GitHub Pages) keeps
       the offline-first SW. -->
  <script>
    (function () {
      const isLocalDev = ['localhost', '127.0.0.1', '::1', '0.0.0.0'].includes(location.hostname);
      if (!('serviceWorker' in navigator)) return;
      if (isLocalDev) {
        navigator.serviceWorker.getRegistrations()
          .then((regs) => regs.forEach((r) => r.unregister()))
          .catch(() => {});
        if (window.caches && caches.keys) {
          caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
        }
        return;
      }
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('[SW] registration failed:', err);
        });
      });
    })();
  </script>
</body>
</html>
